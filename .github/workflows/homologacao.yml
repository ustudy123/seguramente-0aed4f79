# =====================================================================
# Homologação — copiar a ESTRUTURA da produção, por botão
#
# NÃO roda sozinha. Só quando alguém aperta "Run workflow" e digita a
# confirmação. Não tem gatilho por push, de propósito: a homologação não
# deve seguir a `main` — se seguisse, viraria um segundo ambiente de
# teste, e já existe um.
#
# O QUE ELA FAZ
#   1) lê a estrutura da PRODUÇÃO com um usuário SOMENTE LEITURA;
#   2) confere que não veio nenhuma linha de dado junto;
#   3) apaga e recria o schema public da HOMOLOGAÇÃO com essa estrutura;
#   4) guarda o retrato como anexo da corrida, para conferência.
#
# A PRODUÇÃO NUNCA É ALTERADA POR AQUI, e não é promessa de configuração:
# a credencial usada é de um usuário criado com pg_read_all_data e sem
# permissão de escrita (docs/script_homologacao_leitor_producao.sql). Se
# esta esteira tentasse escrever na produção, o banco recusaria.
#
# SECRETS NECESSÁRIOS (Settings > Secrets and variables > Actions):
#   PRODUCAO_DB_URL_LEITURA   conexão da produção com o usuário somente leitura
#   HOMOLOGACAO_DB_URL        conexão da homologação (usuário postgres)
#
# Como montar cada uma está em docs/AMBIENTES.md, seção "Criar a homologação".
# =====================================================================
name: homologacao

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite RECRIAR para confirmar que a homologação será sobrescrita'
        required: true
        default: ''

jobs:
  copiar-estrutura:
    name: Copiar a estrutura da produção para a homologação
    runs-on: ubuntu-latest
    concurrency:
      group: homologacao
      cancel-in-progress: false
    env:
      PRODUCAO_REF: diayjpsrcerycycyaxst
      HOMOLOGACAO_REF: fgsblefvdabgdouipigz
    steps:
      - name: Exigir a confirmação digitada
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "RECRIAR" ]; then
            echo "::error::Confirmação ausente. Rode de novo digitando RECRIAR."
            exit 1
          fi

      - name: Montar e conferir as duas conexões
        env:
          PROD_URL: ${{ secrets.PRODUCAO_DB_URL_LEITURA }}
          PROD_HOST: ${{ secrets.PRODUCAO_DB_HOST }}
          PROD_USER: ${{ secrets.PRODUCAO_DB_USER }}
          PROD_PASSWORD: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_URL: ${{ secrets.HOMOLOGACAO_DB_URL }}
          HOMOLOG_HOST: ${{ secrets.HOMOLOGACAO_DB_HOST }}
          HOMOLOG_USER: ${{ secrets.HOMOLOGACAO_DB_USER }}
          HOMOLOG_PASSWORD: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # Duas formas de informar cada conexão. A segunda existe porque a
          # primeira é a origem do erro mais comum: URI colada errada, com os
          # colchetes de [YOUR-PASSWORD], sem o prefixo postgresql://, ou com
          # senha contendo @ / # / barra, que quebra o endereço.
          #
          #   FORMA A (uma linha):   PRODUCAO_DB_URL_LEITURA / HOMOLOGACAO_DB_URL
          #   FORMA B (três campos): ..._DB_HOST, ..._DB_USER, ..._DB_PASSWORD
          #
          # A forma B é a recomendada: nada de montar endereço na mão, a senha
          # vai crua e a esteira a codifica sozinha.
          montar() {
            local rotulo="$1" url="$2" host="$3" usuario="$4" senha="$5"
            if [ -n "$host" ] || [ -n "$usuario" ] || [ -n "$senha" ]; then
              if [ -z "$host" ] || [ -z "$usuario" ] || [ -z "$senha" ]; then
                echo "::error::$rotulo: informe os TRÊS campos (HOST, USER, PASSWORD) ou nenhum." >&2
                return 1
              fi
              # Codifica usuário e senha; assim caractere especial não quebra nada.
              HOST="$host" USUARIO="$usuario" SENHA="$senha" python3 - <<'PY'
import os, urllib.parse
u = urllib.parse.quote(os.environ["USUARIO"], safe="")
s = urllib.parse.quote(os.environ["SENHA"], safe="")
h = os.environ["HOST"].strip()
porta = "5432"
if ":" in h:
    h, porta = h.rsplit(":", 1)
print(f"postgresql://{u}:{s}@{h}:{porta}/postgres?sslmode=require")
PY
              return 0
            fi
            if [ -z "$url" ]; then
              echo "::error::$rotulo: nenhuma conexão informada. Cadastre os secrets (HOST/USER/PASSWORD é o caminho mais simples)." >&2
              return 1
            fi
            case "$url" in
              postgresql://*|postgres://*) : ;;
              *) echo "::error::$rotulo: o valor não começa com postgresql:// — foi colado incompleto. Use os secrets HOST/USER/PASSWORD." >&2; return 1 ;;
            esac
            case "$url" in
              *"[YOUR-PASSWORD]"*|*"[SENHA]"*)
                echo "::error::$rotulo: a senha não foi trocada — o valor ainda tem [YOUR-PASSWORD]." >&2; return 1 ;;
            esac
            printf '%s' "$url"
          }

          PROD_CONN="$(montar 'Produção (leitura)' "$PROD_URL" "$PROD_HOST" "$PROD_USER" "$PROD_PASSWORD")" || exit 1
          HOMOLOG_CONN="$(montar 'Homologação' "$HOMOLOG_URL" "$HOMOLOG_HOST" "$HOMOLOG_USER" "$HOMOLOG_PASSWORD")" || exit 1

          # A trava mais importante do arquivo. O destino é apagado e recriado;
          # se alguém apontar o destino para a produção, por engano ou por
          # copiar-colar, estas linhas impedem o desastre.
          case "$HOMOLOG_CONN" in
            *"$PRODUCAO_REF"*) echo "::error::O destino aponta para a PRODUÇÃO. Abortando."; exit 1 ;;
          esac
          case "$HOMOLOG_CONN" in
            *"$HOMOLOGACAO_REF"*) echo "Destino confere: homologação." ;;
            *) echo "::error::O destino não é o projeto de homologação. Abortando."; exit 1 ;;
          esac

          # Guarda as duas conexões para os passos seguintes. Ficam mascaradas
          # nos logs: o valor entra como secret da própria corrida.
          echo "::add-mask::$PROD_CONN"
          echo "::add-mask::$HOMOLOG_CONN"
          echo "PROD_CONN=$PROD_CONN"       >> "$GITHUB_ENV"
          echo "HOMOLOG_CONN=$HOMOLOG_CONN" >> "$GITHUB_ENV"

      - name: Instalar as ferramentas do PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Provar que as duas conexões respondem
        run: |
          # Falha aqui é falha de credencial, não de estrutura — e a mensagem
          # diz qual das duas conexões está errada, em vez de um erro de socket.
          psql "$PROD_CONN"    -tAc 'select current_user' \
            || { echo "::error::Não conectou na PRODUÇÃO (leitura). Confira usuário/senha/host do Session pooler."; exit 1; }
          psql "$HOMOLOG_CONN" -tAc 'select current_user' \
            || { echo "::error::Não conectou na HOMOLOGAÇÃO. Confira usuário/senha/host do Session pooler."; exit 1; }

      - name: Ler a estrutura da produção (somente leitura, sem dados)
        run: |
          pg_dump "$PROD_CONN" \
            --schema-only --schema=public \
            --no-owner --no-privileges \
            --no-publications --no-subscriptions \
            -f estrutura_producao.sql
          ls -lh estrutura_producao.sql


      - name: Conferir que NENHUM dado veio junto
        run: |
          # Prova, não confiança: --schema-only não deveria trazer linha
          # nenhuma, e é isto que garante que nenhum CPF, salário ou atestado
          # de gente real saiu da produção. Se aparecer dado, a corrida para
          # antes de tocar na homologação.
          if grep -qE '^(COPY |INSERT INTO )' estrutura_producao.sql; then
            echo "::error::O retrato contém DADOS. Abortando antes de copiar."
            exit 1
          fi
          echo "Nenhuma linha de dado no retrato — só estrutura."

      - name: Recriar o schema public da homologação
        run: |
          psql "$HOMOLOG_CONN" -v ON_ERROR_STOP=1 -c \
            'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

      - name: Aplicar a estrutura na homologação
        run: |
          # Sem ON_ERROR_STOP: restaurar retrato em projeto novo sempre reclama
          # de extensão e permissão que o Supabase já criou sozinho. O que
          # importa é o resultado final, conferido no passo seguinte.
          psql "$HOMOLOG_CONN" -f estrutura_producao.sql 2>&1 | tee restauracao.log | tail -40
          echo "---"
          echo "Total de avisos/erros na restauração: $(grep -c '^ERROR' restauracao.log || true)"

      - name: Conferir o resultado
        run: |
          psql "$HOMOLOG_CONN" -A -F' | ' -c "
            SELECT 'tabelas'  AS item, count(*)::text FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind='r'
            UNION ALL
            SELECT 'funcoes', count(*)::text FROM pg_proc p
              JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'
            UNION ALL
            SELECT 'politicas', count(*)::text FROM pg_policies WHERE schemaname='public';"
          echo
          echo "Compare com a produção: os números têm que BATER."
          echo "Igualdade aqui é sucesso — a homologação existe para ser cópia fiel."

      - name: Guardar o retrato e o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-estrutura
          path: |
            estrutura_producao.sql
            restauracao.log
          retention-days: 7
