# =====================================================================
# Staging automático — YourEyes
#
# A cada mudança mesclada na main:
#   1) aplica as migrations novas no projeto Supabase de STAGING
#      (bmehdgthciuvdbvutsdv — nunca na produção, que não é gerida
#      por CLI) e reimplanta as Edge Functions;
#   2) publica o SITE DE TESTE (build com .env.staging) no GitHub
#      Pages do próprio repositório — sem contas nem secrets extras:
#      https://ustudy123.github.io/seguramente-0aed4f79/
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto de staging
# =====================================================================
name: staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  banco:
    name: Migrations e functions no staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_REF: bmehdgthciuvdbvutsdv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conferir que o alvo é o staging
        run: |
          if [ "$STAGING_REF" = "diayjpsrcerycycyaxst" ]; then
            echo "::error::Alvo aponta para a producao — abortando."; exit 1
          fi
      - name: Aplicar migrations
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase db push --include-all
      - name: Reimplantar Edge Functions
        # O empacotamento baixa dependências de CDNs públicos que às vezes
        # falham momentaneamente (522/timeout) — tenta até 3 vezes.
        run: |
          for i in 1 2 3; do
            if supabase functions deploy --project-ref "$STAGING_REF"; then
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 30s antes de tentar de novo..."
            sleep 30
          done
          echo "::error::Functions deploy falhou após 3 tentativas."
          exit 1

  site:
    name: Site de teste (GitHub Pages)
    needs: banco
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build de staging (sob o subcaminho do Pages)
        run: |
          npm ci
          npm run build:staging -- --base=/seguramente-0aed4f79/
          # SPA em host estático: rota desconhecida cai no index
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
