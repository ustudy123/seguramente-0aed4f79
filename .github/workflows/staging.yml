# =====================================================================
# Staging automático — YourEyes
#
# A cada mudança mesclada na main:
#   1) aplica as migrations novas no projeto Supabase de STAGING
#      (bmehdgthciuvdbvutsdv — nunca na produção, que não é gerida
#      por CLI) e reimplanta as Edge Functions;
#   2) publica o SITE DE TESTE (build com .env.staging) no GitHub
#      Pages do próprio repositório — sem contas nem secrets extras:
#      https://ustudy123.github.io/youreyesnovo/
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto de staging
# =====================================================================
name: staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  banco:
    name: Migrations e functions no staging
    runs-on: ubuntu-latest
    # Serializa SÓ o deploy de banco — dois `db push` nunca rodam concorrentes
    # (era o motivo da concorrência) —, sem que o job de testes de tela (`telas`,
    # lento e às vezes vermelho por conta própria) segure a fila das próximas
    # entregas. Antes a trava era no nível do WORKFLOW: a corrida inteira só
    # "terminava" quando o Cypress terminava, e a leva seguinte ficava presa
    # (pending) atrás dele. Agora a próxima corrida começa na hora; apenas o
    # passo de banco espera o banco anterior — o Cypress roda ao lado, sem travar.
    concurrency:
      group: staging-banco
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_REF: bmehdgthciuvdbvutsdv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versão FIXA (não "latest"): com "latest" a esteira pergunta ao
          # GitHub "qual a release mais nova?" a cada corrida, e essa consulta
          # (sem autenticação) estoura o limite compartilhado do GitHub
          # ("rate limit exceeded"), derrubando a corrida logo no 1º passo.
          # Fixando a versão, ela baixa direto, sem essa consulta. Para subir
          # a ferramenta um dia, basta trocar este número por outro publicado.
          version: 2.113.0
      - name: Conferir que o alvo é o staging
        run: |
          if [ "$STAGING_REF" = "diayjpsrcerycycyaxst" ]; then
            echo "::error::Alvo aponta para a producao — abortando."; exit 1
          fi
      - name: Aplicar migrations
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase db push --include-all
      - name: Reimplantar Edge Functions
        # O empacotamento baixa dependências de CDNs públicos que às vezes
        # falham momentaneamente (522/timeout) — tenta até 3 vezes.
        run: |
          for i in 1 2 3; do
            if supabase functions deploy --project-ref "$STAGING_REF"; then
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 30s antes de tentar de novo..."
            sleep 30
          done
          echo "::error::Functions deploy falhou após 3 tentativas."
          exit 1

  site:
    name: Site de teste (GitHub Pages)
    needs: banco
    runs-on: ubuntu-latest
    env:
      # O NOME DO REPOSITÓRIO VEM DO PRÓPRIO GITHUB, e não escrito à mão.
      #
      # O Pages de um repositório é servido em ustudy123.github.io/<nome>/, e
      # o build precisa saber esse caminho para montar os endereços dos
      # arquivos. Quando o repositório foi renomeado, o nome antigo continuou
      # escrito aqui: o GitHub redirecionou o endereço velho por um tempo, o
      # site pareceu funcionar, e quando o redirecionamento acabou a página
      # passou a responder "There isn't a GitHub Pages site here" — um erro
      # que não menciona renome nenhum e manda procurar no lugar errado.
      #
      # Derivando do próprio evento, um próximo renome se ajusta sozinho.
      REPO: ${{ github.event.repository.name }}
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build de staging (sob o subcaminho do Pages)
        run: |
          npm ci
          npm run build:staging -- --base="/$REPO/"

      - name: Build de homologação (sob /homologacao/ do mesmo Pages)
        run: |
          # O Pages publica UM site por repositório, então os dois ambientes
          # dividem o mesmo endereço em pastas diferentes. Sai mais barato que
          # um segundo host e não precisa de conta nova:
          #
          #   teste       -> .../youreyesnovo/
          #   homologação -> .../<repositório>/homologacao/
          #
          # A trava do vite.config.ts vale aqui: se o .env.homologacao
          # apontasse para o Supabase de produção, este build não nasceria.
          npm run build:homologacao -- \
            --base="/$REPO/homologacao/" \
            --outDir=dist-homologacao
          mv dist-homologacao dist/homologacao
          cp dist/homologacao/index.html dist/homologacao/404.html

      - name: Rota desconhecida cai no app CERTO
        run: |
          # SPA em host estático: quem pede /ferias direto recebe 404, e o
          # 404.html é que carrega o app. Com dois ambientes no mesmo site,
          # isso vira um risco: o 404 da raiz é o app de TESTE, então um link
          # fundo de homologação abriria o teste — e a pessoa acharia que está
          # olhando um ambiente enquanto olha o outro. Confundir os dois é o
          # erro mais caro que este site pode causar.
          #
          # O desvio abaixo roda antes de qualquer bundle: se o caminho pedido
          # está sob /homologacao/, manda para o app de homologação e não deixa
          # o de teste subir. Perde-se a rota interna do link fundo (abre na
          # entrada), o que é preferível a abrir o ambiente errado.
          python3 - <<'PY'
          import io, os
          base = '/' + os.environ['REPO'] + '/homologacao/'
          guarda = (
            '<script>(function(){var b=' + repr(base).replace("'", '"') + ';'
            # O `!== b` evita laço: se a pasta da homologação faltar, o próprio
            # endereço de entrada cairia no 404 e se redirecionaria para sempre.
            'if(location.pathname.indexOf(b)===0&&location.pathname!==b)'
            '{location.replace(b);}})();</script>'
          )
          html = io.open('dist/index.html', encoding='utf-8').read()
          i = html.lower().find('<head>')
          if i == -1:
              raise SystemExit('index.html sem <head> — o desvio nao seria aplicado')
          i += len('<head>')
          io.open('dist/404.html', 'w', encoding='utf-8').write(html[:i] + guarda + html[i:])
          print('404.html da raiz criado com o desvio para a homologacao')
          PY
          grep -q 'homologacao' dist/404.html || { echo "::error::O desvio nao entrou no 404.html"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ===================================================================
  # Testes de TELA (Cypress) contra o site de teste recém-publicado.
  #
  # Roda depois do site, então não atrasa nem bloqueia a publicação:
  # se quebrar, a esteira fica vermelha para avisar, mas o staging já
  # está no ar. O alvo é fixado aqui e conferido de novo pela trava do
  # cypress.config.ts — produção não é alcançável nem de propósito.
  #
  # A conta de teste tem valor padrão no cypress.config.ts, então o job
  # roda sem depender de secret. Os secrets abaixo, se existirem, têm
  # precedência — é assim que se troca a conta sem mexer no código.
  # ===================================================================
  telas:
    name: Testes de tela (Cypress) no staging
    needs: site
    runs-on: ubuntu-latest
    env:
      CYPRESS_BASE_URL: https://ustudy123.github.io/youreyesnovo/
      CYPRESS_EMAIL: ${{ secrets.CYPRESS_EMAIL }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      # Caminho de volta do resultado para o painel de QA. O token tem de
      # ser o mesmo nos dois lados: secret aqui e segredo QA_E2E_TOKEN na
      # Edge Function do staging. Faltando qualquer um dos dois, a suíte
      # roda igual e apenas não reporta — nunca quebra por causa disso.
      QA_E2E_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/qa-registrar-e2e
      QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
      QA_E2E_ORIGEM: esteira staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        run: npm ci
      - name: Guarda — teste de tela só existe se documentado (nível e2e)
        # Reprova a esteira se houver it() no Cypress sem caso documentado.
        # Sem QA_E2E_TOKEN, a guarda se pula sozinha (não bloqueia).
        env:
          QA_COBERTURA_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/qa-cobertura-e2e
          QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
        run: npm run qa:cobertura-e2e
      - name: Esperar o site de teste responder
        # O deploy do Pages retorna antes do CDN servir a versão nova.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$CYPRESS_BASE_URL"; then
              echo "Site de teste no ar."; exit 0
            fi
            echo "Ainda não respondeu (tentativa $i); aguardando 15s..."
            sleep 15
          done
          echo "::error::Site de teste não respondeu a tempo."
          exit 1
      - name: Semear a conta-robô no staging
        # A suíte loga com uma conta fixa (padrão em cypress.config.ts). Se
        # ela não existir no banco de teste, o login falha e TODOS os specs
        # caem no beforeEach. Este passo garante a conta antes de rodar.
        # A função de seed já ficou de pé no job `banco` (functions deploy).
        env:
          SEED_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/seed-e2e-user
          QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
        run: |
          if [ -z "$QA_E2E_TOKEN" ]; then
            echo "::warning::QA_E2E_TOKEN ausente — conta-robô não semeada. Se a suíte falhar no login, é isto."
            exit 0
          fi
          # Mesma conta que a suíte vai usar (mesmo fallback do cypress.config.ts).
          EMAIL="${CYPRESS_EMAIL:-teste@lucas.com}"
          SENHA="${CYPRESS_PASSWORD:-7654321}"
          # JSON montado por python (escapa certo, sem pegadinha de aspas de shell)
          # e enviado como arquivo binário — o corpo chega byte a byte à função.
          E="$EMAIL" S="$SENHA" python3 -c 'import json,os;open("/tmp/seed.json","w").write(json.dumps({"email":os.environ["E"],"senha":os.environ["S"]}))'
          echo "Corpo do seed: $(cat /tmp/seed.json)"
          CODE=$(curl -sS -o /tmp/seed.out -w "%{http_code}" -X POST "$SEED_URL" \
            -H "Content-Type: application/json" \
            -H "x-qa-token: $QA_E2E_TOKEN" \
            --data-binary @/tmp/seed.json)
          echo "Resposta do seed (HTTP $CODE): $(cat /tmp/seed.out)"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Falha ao semear a conta-robô (HTTP $CODE) — a suíte iria falhar no login."
            exit 1
          fi

      - name: Rodar a suíte
        run: npm run test:e2e
      - name: Guardar prints e vídeos da corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
